name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Bir sürümün kırılması diğerlerinin sonucunu gizlemesin
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt
            requirements-pip.txt

      - name: pip'i sabitle
        # Karmaları doğrulayan araç pip'in kendisi ve sürümü koşucu imajından
        # geliyordu; bağımlılıklar sabitken onları kuran şey değildi. Burada
        # sabitleniyor ve kendi karmasıyla doğrulanıyor.
        #
        # Sınır: bu doğrulamayı henüz sabitlenmemiş olan pip yapıyor. Zincir
        # koşucudaki pip'e kadar kısalıyor, sıfıra inmiyor.
        run: |
          pip install --only-binary=:all: --require-hashes -r requirements-pip.txt
          pip --version

      - name: Ayrıcalıksız kullanıcı ad alanlarını aç
        # Ubuntu 24.04 koşucuları ayrıcalıksız user namespace'leri AppArmor
        # ile kısıtlıyor. Bu olmadan sandbox motor testlerinin tamamı
        # atlanıyor - ölçüldü: 25 atlama, 15'i motor. O hâlde CI'daki yeşil
        # sandbox hakkında hiçbir şey söylemiyor.
        #
        # "|| true": kısıtlama olmayan ya da sysctl'e izin vermeyen bir
        # koşucuda adım kırılmasın; testler zaten yetenek yoksa atlıyor.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "max_user_namespaces: $(cat /proc/sys/user/max_user_namespaces)"
          unshare --user --map-root-user --net true \
            && echo "kullanıcı ad alanı: CALISIYOR" \
            || echo "kullanıcı ad alanı: YOK (motor testleri atlanacak)"

      - name: Kilit requirements.txt ile tutarlı mı
        # Kurulum kilitten yapıldığı için, requirements.txt güncellenip kilit
        # unutulursa CI eski sürümü test eder ve bunu fark etmezdik. Burada
        # kilitteki sabitlemeler kısıt olarak veriliyor: uyuşmazlarsa pip
        # çözüm yapamaz ve adım kırılır. Karmalar ayıklanıyor, çünkü karma
        # gören pip her paketin == ile sabitlenmesini bekler; requirements.txt
        # ise bilerek ~= kullanıyor.
        run: |
          grep -v -e '--hash' -e '^[[:space:]]*#' requirements-lock.txt \
            | sed 's/[[:space:]]*\\$//' > /tmp/pins.txt
          cat /tmp/pins.txt
          pip install --dry-run --ignore-installed \
            -r requirements.txt -c /tmp/pins.txt

      - name: Bağımlılıkları kur
        # Kurulum kilitten: sürümler sabit ve indirilen her dosyanın sha256'sı
        # doğrulanıyor. Karma tutmazsa kurulum durur.
        #
        # --only-binary bilerek: kilitte hem tekerlek hem sdist karması var,
        # dolayısıyla tekerlek karması tutmazsa pip sessizce sdist'e düşüp
        # kaynaktan derleyebiliyor. O yolda derleme bağımlılıkları (flit_core
        # gibi) karma doğrulaması olmadan indiriliyor - yani doğrulamada bir
        # boşluk kalıyor. Yalnızca tekerlek kullanmak ikisini de kapatıyor.
        run: "pip install --only-binary=:all: --require-hashes -r requirements-lock.txt"

      - name: Kurulan sürümler
        run: pip freeze

      - name: Testler
        # Test paketi yalnızca stdlib kullanıyor; ek bir koşucuya gerek yok.
        # videos.json ve rate_limits.db takipsiz olduğu için temiz checkout'ta
        # yoklar; app.py içe aktarılırken kendisi oluşturuyor.
        run: python -m unittest -v
