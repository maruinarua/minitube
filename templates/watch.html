<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ video.title }} - MiniTube</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #121212;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 16px;
            padding-bottom: 40px;
        }
        a { color: #aaa; text-decoration: none; }
        h1 { font-size: 1.3rem; margin: 12px 0; }
        video {
            width: 100%;
            max-height: 70vh;
            background: #000;
            border-radius: 12px;
            margin-bottom: 16px;
        }
        .info {
            background: #1e1e1e;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .stats {
            color: #aaa;
            margin: 8px 0 16px;
            font-size: 0.95rem;
        }
        #likeBtn {
            background: #333;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        #likeBtn.liked {
            background: #ff4757;
        }
        #likeBtn:hover {
            opacity: 0.9;
        }

        /* Yorum kısmı */
        .comments-section {
            background: #1e1e1e;
            padding: 16px;
            border-radius: 12px;
        }
        .comments-section h3 {
            margin-bottom: 14px;
            font-size: 1.1rem;
        }
        .comment-form textarea {
            width: 100%;
            height: 80px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #2a2a2a;
            color: white;
            font-size: 1rem;
            resize: none;
            margin-bottom: 10px;
        }
        .comment-form button {
            background: #ff0000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .comment {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
        }
        .comment .time {
            color: #888;
            font-size: 0.8rem;
            margin-bottom: 4px;
        }
        .comment .text {
            line-height: 1.4;
        }
        .no-comments {
            color: #777;
            font-size: 0.95rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <a href="/">← Ana Sayfa</a>
    <h1>{{ video.title }}</h1>

    <video controls autoplay>
        <source src="/uploads/{{ video.filename }}" type="video/mp4">
        Tarayıcınız video desteklemiyor.
    </video>

    <div class="info">
        <div class="stats">
            👁 {{ video.views }} görüntülenme
        </div>

        <button id="likeBtn" class="{{ 'liked' if already_liked else '' }}" onclick="likeVideo()">
            ❤️ <span id="likeCount">{{ video.likes }}</span> Beğeni
        </button>
    </div>

    <!-- YORUMLAR -->
    <div class="comments-section">
        <h3>💬 Yorumlar ({{ video.comments|length if video.comments else 0 }})</h3>

        <form class="comment-form" action="/comment/{{ video.filename }}" method="POST">
            <textarea name="comment" placeholder="Yorumunu yaz..." required></textarea>
            <button type="submit">Gönder</button>
        </form>

        {% if video.comments %}
            {% for c in video.comments|reverse %}
            <div class="comment">
                <div class="time">{{ c.time }}</div>
                <div class="text">{{ c.text }}</div>
            </div>
            {% endfor %}
        {% else %}
            <p class="no-comments">Henüz yorum yok. İlk yorumu sen yap!</p>
        {% endif %}
    </div>

    <script>
        async function likeVideo() {
            const btn = document.getElementById("likeBtn");
            const res = await fetch("/like/{{ video.filename }}", {
                method: "POST"
            });
            const data = await res.json();

            if (data.likes !== undefined) {
                document.getElementById("likeCount").innerText = data.likes;
                if (data.liked) {
                    btn.classList.add("liked");
                } else {
                    btn.classList.remove("liked");
                }
            }
        }
    </script>
</body>
</html>
