name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Bir sürümün kırılması diğerlerinin sonucunu gizlemesin
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Testler
        # Test paketi yalnızca stdlib kullanıyor; ek bir koşucuya gerek yok.
        # videos.json ve rate_limits.db takipsiz olduğu için temiz checkout'ta
        # yoklar; app.py içe aktarılırken kendisi oluşturuyor.
        run: python -m unittest -v
