name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Bir sürümün kırılması diğerlerinin sonucunu gizlemesin
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-lock.txt

      - name: Bağımlılıkları kur
        # Ne kurulacağı requirements.txt'den, hangi sürüm olacağı kilitten
        # geliyor. Alt bağımlılıklar da (Jinja2, MarkupSafe, ...) sabitleniyor.
        # İki dosya birbirinden ayrı düşerse pip çözüm yapamaz ve adım kırılır.
        run: pip install -r requirements.txt -c requirements-lock.txt

      - name: Kurulan sürümler
        run: pip freeze

      - name: Testler
        # Test paketi yalnızca stdlib kullanıyor; ek bir koşucuya gerek yok.
        # videos.json ve rate_limits.db takipsiz olduğu için temiz checkout'ta
        # yoklar; app.py içe aktarılırken kendisi oluşturuyor.
        run: python -m unittest -v
